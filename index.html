HTML

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Blooming</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #fff5f7;
      color: #603d4b;
      text-align: center;
    }
    main {
      padding: 70px 20px;
    }
    .flower {
      font-size: 65px;
    }
    h1 {
      color: #c45b83;
      font-size: 38px;
    }
    p {
      font-size: 18px;
      line-height: 1.7;
    }
    button {
      background: #c45b83;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
    #message {
      margin-top: 24px;
      color: #a33d69;
    }
  </style>
</head>
<body>
  <main>
    <div class="flower">🌸</div>
    <h1>Something Blooming</h1>
    <p>A little space for big dreams.</p>
    <button onclick="bloom()">Tap to Bloom</button>
    <p id="message"></p>
  </main>
  <script>
    function bloom() {
      document.getElementById("message").textContent =
        "Every beautiful thing begins with a little seed. 🌷";
    }
  </script>
</body>
</html>
